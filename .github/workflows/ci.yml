# Runs the full local check suite on every pull request and on pushes to main.
# Until this existed the only workflow in the repository was npm-publish.yml,
# which fires on `release: published` — so nothing verified a change before it
# reached main, and `yarn test` had never run in CI at all.
name: CI
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same pull request makes the in-flight run obsolete, so
# cancel it rather than paying for a result nobody will read.
#
# The event is encoded in the group key rather than in cancel-in-progress. An
# earlier version of this file used
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# which does not do what it reads as: the expression yields the *string*
# "false" on a push, and a non-empty string is truthy, so pushes to main
# cancelled one another. Merging two pull requests seconds apart duly killed
# the run for the first merge commit.
#
# Keying pushes by SHA instead gives every commit on main its own group, so a
# main run can never be cancelled by the commit that follows it, while pull
# request runs still collapse onto the newest push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to a commit SHA rather than a moving tag. A tag can be
      # repointed at new code by whoever controls the upstream repository, so the
      # pin is what makes a compromised action show up as a reviewable diff rather
      # than arriving silently. The trailing comment carries the human-readable
      # version; Dependabot updates the SHA and the comment together.
      #
      # These versions also clear the Node 20 deprecation warning, and match the
      # SHAs already running in the sibling LiturgicalCalendar repositories.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Yarn 4.6.0 is pinned by the `packageManager` field; corepack is what
      # honours it. Without this, setup-node would use whatever yarn ships.
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the Node line used by npm-publish.yml, so a green CI run
          # reflects the environment the package is actually built in.
          node-version: '22.x'
          # Still supported for yarn in v6+. The v6 breaking change narrowed the
          # `package-manager-cache` automatic detection to npm; an explicit
          # `cache` input is unaffected.
          cache: 'yarn'
      # --immutable fails if package.json and yarn.lock have drifted apart,
      # which is the same gate the publish workflow relies on.
      - name: Install dependencies
        run: yarn install --immutable
      - name: Compile
        run: yarn compile
      - name: Run tests
        run: yarn test
      # Two complementary tools: markdownlint owns the .markdownlint.yml rules,
      # prettier owns formatting (including MD060 table alignment, which
      # markdownlint can report but not fix). See CLAUDE.md.
      - name: Lint markdown
        run: yarn lint:md
      - name: Check markdown formatting
        run: yarn format:md
      # The storybook build exercises the vite/rollup toolchain that nothing
      # else in this job touches, and catches story-level breakage early.
      - name: Build Storybook
        run: yarn storybook:build
