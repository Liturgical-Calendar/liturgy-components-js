# Dependabot configuration. Unlike the sibling PHP repositories there is no
# `target-branch` here: this repository's default branch is `main`, and that is
# also what releases are cut from, so version updates belong there directly.

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 7 days before proposing updates to newly published versions, to
    # reduce exposure to a compromised or yanked release (supply-chain).
    cooldown:
      default-days: 7
    labels:
      - 'github-actions'
    # Batch all action bumps into a single PR. The workflows pin actions by
    # commit SHA with the version in a trailing comment; Dependabot rewrites
    # both together, which is the whole reason the pins stay readable.
    groups:
      github-actions:
        patterns:
          - '*'

  # npm/Yarn devDependencies (storybook, vite, typescript, jest, playwright,
  # markdownlint-cli2, …). Yarn Berry is supported via package.json + yarn.lock.
  # The published package has zero runtime dependencies, so everything Dependabot
  # raises here is build- or test-time only and never reaches consumers.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    # There are six npm groups below, and Dependabot's default limit on open
    # version-update PRs is five. Once that ceiling is reached it stops opening
    # new ones, so a group can be starved indefinitely by unrelated PRs sitting
    # in review — silently, with nothing to indicate an update was withheld.
    # Ten leaves headroom for every group plus a security update or two.
    open-pull-requests-limit: 10
    labels:
      - 'javascript dependencies'
    # Groups are matched in the order they are declared — a dependency joins the
    # FIRST group whose patterns match — so every specific group must precede the
    # catch-all `dev-dependencies`.
    groups:
      # storybook core and its addons are hard-locked to one another:
      # @storybook/html-vite@10.5.7 peer-depends on storybook@^10.5.7, so a lone
      # addon bump cannot install cleanly. They must move in a single PR.
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      # jest and its environment package share a major line; jest-environment-jsdom
      # is published in lockstep with jest itself.
      jest:
        patterns:
          - 'jest'
          - 'jest-environment-*'
      # react and react-dom must match exactly, and the @types packages track the
      # runtime major they describe.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # The playwright driver and its test runner are released together and
      # refuse to run against a mismatched pair.
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/*'
      # vite gets a group of its own so its major line does not hold anything
      # else hostage. It was initially left to the catch-all, and #19 showed why
      # that is wrong: vite 8.2.0 arrived bundled with two bootstrap patches, and
      # because Dependabot reports a group's update-type as the highest it
      # contains, the whole PR counted as major and auto-merge correctly refused
      # it — patches included. Isolated, the patches flow and the major waits.
      #
      # Nothing forces vite to move with storybook: @storybook/html-vite accepts
      # vite ^5 || ^6 || ^7 || ^8, so the two majors are genuinely independent.
      vite:
        patterns:
          - 'vite'
      dev-dependencies:
        patterns:
          - '*'
